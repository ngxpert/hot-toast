@let toastData = toast();
<div
  class="hot-toast-bar-base-container"
  [style]="containerPositionStyle()"
  [class]="'hot-toast-theme-' + toastData.theme"
  [style.--hot-toast-scale]="scale()"
  [style.--hot-toast-translate-y]="translateY()"
>
  <div class="hot-toast-bar-base-wrapper" (mouseenter)="handleMouseEnter()" (mouseleave)="handleMouseLeave()">
    <div
      class="hot-toast-bar-base"
      #hotToastBarBase
      [style]="toastBarBaseStylesSignal()"
      [class]="toastData.className"
      [style.--hot-toast-animation-state]="isManualClose ? 'running' : 'paused'"
      [style.--hot-toast-exit-animation-state]="isShowingAllToasts() ? 'paused' : 'running'"
      [style.--hot-toast-exit-animation-delay]="exitAnimationDelay()"
      [attr.aria-live]="toastData.ariaLive"
      [attr.role]="toastData.role"
    >
      <div class="hot-toast-icon" aria-hidden="true">
        @if (toastData.icon !== undefined) {
          @if (isIconString()) {
            <hot-toast-animated-icon [iconTheme]="toastData.iconTheme">{{ toastData.icon }}</hot-toast-animated-icon>
          } @else {
            <div>
              <ng-container *dynamicView="toastData.icon" />
            </div>
          }
        } @else {
          <hot-toast-indicator [theme]="toastData.iconTheme" [type]="toastData.type" />
        }
      </div>
      <div class="hot-toast-message">
        <ng-container *dynamicView="toastData.message!; context: context; injector: toastComponentInjector" />
      </div>
      @if (toastData.dismissible) {
        <button
          (click)="close()"
          type="button"
          class="hot-toast-close-btn"
          [attr.aria-label]="toast().closeLabel"
          [style]="toastData.closeStyle"
        ></button>
      }
    </div>
  </div>
</div>
